# GitHub Actions 워크플로 템플릿
#
# 새 워크플로는 이 파일을 `.github/workflows/<이름>.yml`로 복사해 시작한다.
# (이 템플릿 자체는 workflows/ 밖에 있어 실행되지 않는다.)
# 아래 가드레일은 복사한 뒤에도 지우지 않는다. Actions 실행 분(minute)은 유료 공유 예산이라,
# 워크플로는 "필요할 때만, 짧게" 돌아야 한다. AGENTS.md는 도구별 운영 규칙을 담지 않으므로
# GitHub Actions에 한정된 것은 여기가 단일 출처다(AGENTS.md 9절).
#
#   1. 트리거 최소화 — push와 pull_request를 같은 브랜치에 겹치게 걸지 않는다(같은 커밋이
#      두 번 돈다). push는 기본 브랜치로 한정하고 `branches: ["**"]`는 쓰지 않는다.
#      `paths` 필터를 건다. 생략해도 되는 것은 저장소 전체를 대상으로 하고 설치 단계가
#      없는 검사뿐이다.
#   2. `timeout-minutes`를 모든 job에 명시한다(10분 이하 권장). 지정하지 않으면 360분이라
#      걸린 잡 하나가 월 예산을 태울 수 있다.
#   3. `concurrency` + `cancel-in-progress: true` — 연속 push 시 이전 실행을 취소한다.
#   4. `permissions`는 필요한 최소만.
#   5. `schedule`(크론)과 매트릭스 빌드는 소유자가 명시적으로 승인할 때만 추가한다.
#   6. 검사를 늘릴 때는 워크플로를 늘리지 말고 기존 워크플로에 step으로 더한다.
#   7. 사용량 경고가 보이면(예: 월 예산 80~90% 도달) 워크플로 추가와 트리거 확대를 멈추고
#      소유자와 상의한다.

name: {{워크플로-이름}}

on:
  # 트리거는 최소로. push와 pull_request를 같은 브랜치에 겹치게 걸지 않는다(중복 실행 = 분 낭비).
  pull_request:
    paths: ["{{관련-경로 — 예: src/**}}"]   # 관련 파일이 바뀔 때만 실행
  push:
    branches: [{{기본-브랜치}}]             # 기본 브랜치만. branches: ["**"] 금지
    paths: ["{{관련-경로}}"]
  workflow_dispatch:                        # 수동 실행은 항상 열어 둔다
  # schedule(크론)은 소유자가 명시적으로 승인할 때만 추가한다.

# 같은 ref에서 새 실행이 시작되면 이전 실행을 취소한다
concurrency:
  group: {{워크플로-이름}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read                            # 필요한 최소 권한만 명시

jobs:
  {{잡-이름}}:
    runs-on: ubuntu-latest
    timeout-minutes: 10                     # 필수. 없으면 기본 360분 — 걸린 잡 하나가 예산을 태운다
    steps:
      - uses: actions/checkout@v4

      - name: {{단계-이름}}
        run: {{명령}}
