name: checks

# 트리거 최소화 (AGENTS.md 9절): PR + 기본 브랜치 push만.
# paths 필터는 걸지 않는다 — 문서·코드 어느 쪽이 바뀌어도 걸려야 하고, 세 검사 모두
# 설치 단계 없이 몇 초에 끝난다(9절의 예외 조건).
# 같은 커밋이 push와 pull_request로 두 번 실행되지 않게 push는 main으로 한정한다.
on:
  pull_request:
    # ready_for_review는 기본 타입에 없다 — Draft를 Ready로 바꿀 때 작업 결과 문서 검사를
    # 경고에서 실패로 올려 다시 봐야 한다(아래 `.ai/` 검사 step).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# 같은 ref의 이전 실행은 취소해 분 낭비를 막는다
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: 문서·파일 크기 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 히스토리를 전부 받는다. `--added`가 쓰는 머지 커밋의 첫 부모(base)뿐 아니라,
          # `없음(직접 push, abc1234)` 탈출구의 그 커밋이 **실제로 있는지** 확인해야 하기
          # 때문이다 — 얕은 클론이면 오래된 커밋이 없어 정당한 기록이 거짓으로 걸린다.
          # 히스토리가 아주 긴 저장소는 줄여도 되지만, 그러면 그 확인을 포기하는 것이다.
          fetch-depth: 0

      - name: 상대 링크가 실제 파일을 가리키는지 확인
        run: python3 .github/scripts/check_markdown_links.py

      # 검사를 늘릴 때는 워크플로를 늘리지 말고 step으로 더한다 (AGENTS.md 9절)
      #
      # 작업 결과 문서는 PR을 연 뒤에 링크를 채운 채로 만든다. 그래서 이 검사에는 임시값을
      # 봐주는 구간이 없다 — 어느 실행에서든 같은 기준으로 본다
      # (.ai/work-result/README.md의 `PR` 필드 채우는 순서).
      #
      # `--added`에는 이 PR이 새로 추가한 작업 결과 문서를 준다. 그 문서가 `PR: 없음(...)`이면
      # 실패한다 — PR로 올라오는 중인데 "PR 없음"이라 적은 것이기 때문이다. 과거에 직접
      # push로 남긴 문서는 목록에 없으므로 걸리지 않는다.
      #
      # `--require-work-result`는 이 PR이 결과 문서를 **하나도 추가하지 않았으면** 잡는다.
      # PR을 연 첫 실행(opened)과 Draft는 경고만 한다 — 결과 문서는 PR을 연 뒤에 만들므로
      # 그때는 없는 것이 정상이다. 그 뒤의 push·Ready 전환부터는 실패해 머지를 막는다.
      # Draft를 못 쓰는 저장소(Free 요금제의 private)도 opened 갈래로 첫 push가 초록이다.
      - name: .ai/ 인덱스·머리말 규약 확인
        if: always()
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # base는 payload의 base.sha가 아니라 머지 커밋의 첫 부모로 잡는다 — payload 값은
          # 재실행·synchronize에서 낡을 수 있고, 그러면 그사이 main에 올라간 문서까지
          # "이 PR이 추가했다"고 잡는다.
          #
          # `--added` 계산이 실패해도 본 검사는 반드시 돌아야 하므로 실패를 삼킨다.
          # 잡을 것을 못 잡을지언정 검사 자체가 사라지지는 않게 한다.
          added=""
          base=""
          require="off"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base=$(git rev-parse --verify --quiet "HEAD^1" || true)
            if [ -n "$base" ]; then
              # diff가 실패하면 `added`가 비어 결과 문서가 있어도 "없다"로 실패한다 — 그때는
              # 결과 문서 검사만 끈다.
              if ! added=$(git diff --name-only --diff-filter=A "$base" HEAD -- .ai/work-result); then
                added=""
                echo "::warning::git diff 실패로 결과 문서 추가 여부 검사를 건너뛴다"
              elif [ "$PR_DRAFT" = "true" ] || [ "$PR_ACTION" = "opened" ]; then
                require="warn"
              else
                require="fail"
              fi
            else
              echo "::warning::머지 커밋의 부모를 찾지 못해 'PR: 없음(...)' 검사를 건너뛴다"
            fi
          fi
          # base를 함께 넘긴다 — 뒤늦은 기록의 커밋이 이 PR **전에** 들어와 있던 것인지 본다.
          python3 .github/scripts/check_doc_index.py --added "$added" --base "$base" \
            --require-work-result "$require"

      - name: 파일 크기 규칙 확인
        if: always()
        run: python3 .github/scripts/check_file_size.py
