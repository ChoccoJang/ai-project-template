name: checks

# 트리거 최소화 (AGENTS.md 9절): PR + 기본 브랜치 push만.
# paths 필터는 걸지 않는다 — 문서·코드 어느 쪽이 바뀌어도 걸려야 하고, 세 검사 모두
# 설치 단계 없이 몇 초에 끝난다(9절의 예외 조건).
# 같은 커밋이 push와 pull_request로 두 번 실행되지 않게 push는 main으로 한정한다.
on:
  pull_request:
    # ready_for_review·converted_to_draft는 기본 타입에 없다 — Draft를 오갈 때 작업 결과 문서
    # 검사를 경고↔실패로 바꿔 다시 봐야 한다(아래 `.ai/` 검사 step). 없으면 Draft로 되돌린
    # PR이 빨간 채로 남는다.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

# 같은 ref의 이전 실행은 취소해 분 낭비를 막는다
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: 문서·파일 크기 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 히스토리를 전부 받는다. `--added`가 쓰는 머지 커밋의 첫 부모(base)뿐 아니라,
          # `없음(직접 push, abc1234)` 탈출구의 그 커밋이 **실제로 있는지** 확인해야 하기
          # 때문이다 — 얕은 클론이면 오래된 커밋이 없어 정당한 기록이 거짓으로 걸린다.
          # 히스토리가 아주 긴 저장소는 줄여도 되지만, 그러면 그 확인을 포기하는 것이다.
          fetch-depth: 0

      - name: 상대 링크가 실제 파일을 가리키는지 확인
        run: python3 .github/scripts/check_markdown_links.py

      # 일반 PR은 opened부터 결과 문서 필수. Draft만 경고한다.
      # 원본 템플릿의 기록 예외는 check_ci_docs.py가 저장소 정체성으로 제한한다.
      # base/diff 실패는 검사를 끄지 않고 실패 처리한다.
      - name: .ai/ 인덱스·머리말 규약 확인
        if: always()
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 .github/scripts/check_ci_docs.py

      - name: 파일 크기 규칙 확인
        if: always()
        run: python3 .github/scripts/check_file_size.py

      # 원본 템플릿 저장소의 선택 항목. 도입한 프로젝트가 optional/을 지우면 건너뛴다.
      - name: 선택 항목 UI 토큰 생성물·대비 확인
        if: ${{ !cancelled() && hashFiles('optional/ui-design/.agents/skills/ui-design/SKILL.md') != '' }}
        run: python3 optional/ui-design/.agents/skills/ui-design/scripts/build_tokens.py --check

      - name: 문서 검사 회귀 테스트
        if: always()
        run: python3 -m unittest discover -s .github/scripts/tests -v
