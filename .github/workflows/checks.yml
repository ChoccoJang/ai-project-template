name: checks

# 트리거 최소화 (AGENTS.md 9절): PR + 기본 브랜치 push만.
# paths 필터는 걸지 않는다 — 문서·코드 어느 쪽이 바뀌어도 걸려야 하고, 세 검사 모두
# 설치 단계 없이 몇 초에 끝난다(9절의 예외 조건).
# 같은 커밋이 push와 pull_request로 두 번 실행되지 않게 push는 main으로 한정한다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 ref의 이전 실행은 취소해 분 낭비를 막는다
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: 문서·파일 크기 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 실행에서 이 커밋은 "base에 PR을 머지해 본" 커밋이고 첫 부모가 base다.
          # 아래 `--added`는 그 부모와만 비교하므로 커밋 둘이면 충분하다.
          fetch-depth: 2

      - name: 상대 링크가 실제 파일을 가리키는지 확인
        run: python3 .github/scripts/check_markdown_links.py

      # 검사를 늘릴 때는 워크플로를 늘리지 말고 step으로 더한다 (AGENTS.md 9절)
      #
      # `--merge-gate`는 작업 결과 문서의 `PR: 미정`을 실패로 본다. **어느 실행에서든 켠다** —
      # PR을 여는 실행만 봐주면 링크를 채우는 커밋을 잊은 PR이 green으로 머지된다. PR을 연
      # 직후 한 번 빨개지는 것은 정상이고, 링크를 채워 push하면 사라진다
      # (.ai/work-result/README.md의 `PR` 필드 채우는 순서).
      #
      # `--added`에는 이 PR이 새로 추가한 작업 결과 문서를 준다. 그 문서가 `PR: 없음(...)`이면
      # 실패한다 — PR로 올라오는 중인데 "PR 없음"이라 적은 것이기 때문이다. 과거에 직접
      # push로 남긴 문서는 목록에 없으므로 걸리지 않는다.
      - name: .ai/ 인덱스·머리말 규약 확인
        if: always()
        run: |
          # base는 payload의 base.sha가 아니라 머지 커밋의 첫 부모로 잡는다 — payload 값은
          # 재실행·synchronize에서 낡을 수 있고, 그러면 그사이 main에 올라간 문서까지
          # "이 PR이 추가했다"고 잡는다.
          #
          # `--added` 계산이 실패해도 필수 검사(`--merge-gate`)는 반드시 돌아야 하므로
          # 실패를 삼킨다. 잡을 것을 못 잡을지언정 검사 자체가 사라지지는 않게 한다.
          added=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base=$(git rev-parse --verify --quiet "HEAD^1" || true)
            if [ -n "$base" ]; then
              added=$(git diff --name-only --diff-filter=A "$base" HEAD -- .ai/work-result || true)
            else
              echo "::warning::머지 커밋의 부모를 찾지 못해 'PR: 없음(...)' 검사를 건너뛴다"
            fi
          fi
          python3 .github/scripts/check_doc_index.py --merge-gate --added "$added"

      - name: 파일 크기 규칙 확인
        if: always()
        run: python3 .github/scripts/check_file_size.py
