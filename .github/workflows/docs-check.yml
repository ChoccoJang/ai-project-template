name: docs-check

on:
  push:
    branches: ["**"]
    paths: ["**/*.md", ".github/scripts/check_markdown_links.py", ".github/workflows/docs-check.yml"]
  pull_request:
    paths: ["**/*.md", ".github/scripts/check_markdown_links.py", ".github/workflows/docs-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: 문서 상대 링크 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 상대 링크가 실제 파일을 가리키는지 확인
        run: python3 .github/scripts/check_markdown_links.py
